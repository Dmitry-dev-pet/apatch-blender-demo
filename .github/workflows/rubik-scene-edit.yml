name: Blender bounded scene edit

on:
  push:
    branches:
      - main
    paths:
      - "blender/build_sequence_demo.py"
      - "blender/apply_scene_edit.py"
      - "blender/verify_scene_edit.py"
      - "contracts/BLENDER-SCENE-EDIT-001.json"
      - ".github/workflows/rubik-scene-edit.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  BLENDER_VERSION: "5.2.2"
  BLENDER_CACHE: "/home/runner/.cache/blender-5.2.2"

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Cache Blender
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/blender-5.2.2
          key: blender-linux-x64-5.2.2

      - name: Install Blender
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$BLENDER_CACHE"
          if [ ! -x "$BLENDER_CACHE/blender" ]; then
            archive="blender-${BLENDER_VERSION}-linux-x64.tar.xz"
            base="https://download.blender.org/release/Blender5.2"
            curl --fail --location --retry 4 --output "/tmp/$archive" "$base/$archive"
            tar -xJf "/tmp/$archive" -C "$BLENDER_CACHE" --strip-components=1
          fi
          echo "$BLENDER_CACHE" >> "$GITHUB_PATH"
          "$BLENDER_CACHE/blender" --version

      - name: Install headless dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libx11-6 libxi6 libxfixes3 libxrender1 \
            libxxf86vm1 libxkbcommon0

      - name: Rebuild frozen base scene
        shell: bash
        run: |
          set -euo pipefail
          rm -rf sequence_output edit_output
          blender --background --factory-startup \
            --python-exit-code 1 \
            --python blender/build_sequence_demo.py

      - name: Apply bounded edit
        shell: bash
        run: |
          set -euo pipefail
          blender sequence_output/sequence-animated.blend --background \
            --python-exit-code 1 \
            --python blender/apply_scene_edit.py

      - name: Upload base and edited scenes
        uses: actions/upload-artifact@v4
        with:
          name: bounded-edit-prepared
          path: |
            sequence_output/sequence-animated.blend
            edit_output/edited-sequence.blend
            edit_output/edit-preview.png
            edit_output/edit-manifest.json
          if-no-files-found: error

  render:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: "01"
            start: 1
            end: 30
          - shard: "02"
            start: 31
            end: 60
          - shard: "03"
            start: 61
            end: 90
          - shard: "04"
            start: 91
            end: 120
          - shard: "05"
            start: 121
            end: 150
          - shard: "06"
            start: 151
            end: 180

    steps:
      - uses: actions/checkout@v4

      - name: Cache Blender
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/blender-5.2.2
          key: blender-linux-x64-5.2.2

      - name: Install Blender
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$BLENDER_CACHE"
          if [ ! -x "$BLENDER_CACHE/blender" ]; then
            archive="blender-${BLENDER_VERSION}-linux-x64.tar.xz"
            base="https://download.blender.org/release/Blender5.2"
            curl --fail --location --retry 4 --output "/tmp/$archive" "$base/$archive"
            tar -xJf "/tmp/$archive" -C "$BLENDER_CACHE" --strip-components=1
          fi
          echo "$BLENDER_CACHE" >> "$GITHUB_PATH"

      - name: Install headless dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libx11-6 libxi6 libxfixes3 libxrender1 \
            libxxf86vm1 libxkbcommon0

      - name: Download edited scene
        uses: actions/download-artifact@v4
        with:
          name: bounded-edit-prepared
          path: .

      - name: Render edited shard
        shell: bash
        env:
          START_FRAME: ${{ matrix.start }}
          END_FRAME: ${{ matrix.end }}
        run: |
          set -euo pipefail
          mkdir -p edit_output/frames
          blender edit_output/edited-sequence.blend --background \
            -s "$START_FRAME" \
            -e "$END_FRAME" \
            -o "$GITHUB_WORKSPACE/edit_output/frames/frame_" \
            -F PNG \
            --render-anim
          expected=$((END_FRAME - START_FRAME + 1))
          actual=$(find edit_output/frames -maxdepth 1 -name 'frame_*.png' | wc -l)
          test "$actual" -eq "$expected"

      - name: Upload edited shard
        uses: actions/upload-artifact@v4
        with:
          name: bounded-edit-frames-${{ matrix.shard }}
          path: edit_output/frames/
          if-no-files-found: error
          compression-level: 1

  finalize:
    needs:
      - prepare
      - render
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Cache Blender
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/blender-5.2.2
          key: blender-linux-x64-5.2.2

      - name: Install Blender
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$BLENDER_CACHE"
          if [ ! -x "$BLENDER_CACHE/blender" ]; then
            archive="blender-${BLENDER_VERSION}-linux-x64.tar.xz"
            base="https://download.blender.org/release/Blender5.2"
            curl --fail --location --retry 4 --output "/tmp/$archive" "$base/$archive"
            tar -xJf "/tmp/$archive" -C "$BLENDER_CACHE" --strip-components=1
          fi
          echo "$BLENDER_CACHE" >> "$GITHUB_PATH"

      - name: Install verification dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libx11-6 libxi6 libxfixes3 libxrender1 \
            libxxf86vm1 libxkbcommon0 ffmpeg

      - name: Download prepared scenes
        uses: actions/download-artifact@v4
        with:
          name: bounded-edit-prepared
          path: .

      - name: Download all edited frames
        uses: actions/download-artifact@v4
        with:
          pattern: bounded-edit-frames-*
          path: edit_output/frames
          merge-multiple: true

      - name: Validate frame set
        shell: bash
        run: |
          set -euo pipefail
          actual=$(find edit_output/frames -maxdepth 1 -name 'frame_*.png' | wc -l)
          test "$actual" -eq 180
          test -s edit_output/frames/frame_0001.png
          test -s edit_output/frames/frame_0180.png

      - name: Encode edited MP4
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -y \
            -framerate 30 \
            -start_number 1 \
            -i edit_output/frames/frame_%04d.png \
            -c:v libx264 \
            -pix_fmt yuv420p \
            -crf 20 \
            -movflags +faststart \
            edit_output/edit-demo.mp4

      - name: Verify frozen bounded-edit contract
        shell: bash
        run: |
          set -euo pipefail
          blender edit_output/edited-sequence.blend --background \
            --python-exit-code 1 \
            --python blender/verify_scene_edit.py
          cat edit_output/edit-verification.json

      - name: Remove intermediate frames
        run: rm -rf edit_output/frames

      - name: Upload bounded-edit evidence
        uses: actions/upload-artifact@v4
        with:
          name: rubik-bounded-edit-480
          path: edit_output/
          if-no-files-found: error
