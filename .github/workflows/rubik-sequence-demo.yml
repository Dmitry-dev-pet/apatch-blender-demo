name: Rubik sequence 480

on:
  push:
    branches:
      - main
    paths:
      - "blender/build_sequence_demo.py"
      - "blender/verify_sequence_demo.py"
      - "contracts/BLENDER-RUBIK-SEQUENCE-001.json"
      - ".github/workflows/rubik-sequence-demo.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  BLENDER_VERSION: "5.2.2"
  BLENDER_CACHE: "/home/runner/.cache/blender-5.2.2"

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Cache Blender
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/blender-5.2.2
          key: blender-linux-x64-5.2.2

      - name: Install Blender
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$BLENDER_CACHE"
          if [ ! -x "$BLENDER_CACHE/blender" ]; then
            archive="blender-${BLENDER_VERSION}-linux-x64.tar.xz"
            base="https://download.blender.org/release/Blender5.2"
            curl --fail --location --retry 4 --output "/tmp/$archive" "$base/$archive"
            curl --fail --location --retry 4 --output /tmp/blender.sha256 "$base/blender-${BLENDER_VERSION}.sha256"
            grep " $archive$" /tmp/blender.sha256 > /tmp/blender-linux.sha256
            (cd /tmp && sha256sum --check blender-linux.sha256)
            tar -xJf "/tmp/$archive" -C "$BLENDER_CACHE" --strip-components=1
          fi
          echo "$BLENDER_CACHE" >> "$GITHUB_PATH"
          blender --version

      - name: Install headless dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libx11-6 libxi6 libxfixes3 libxrender1 \
            libxxf86vm1 libxkbcommon0

      - name: Build sequence scene
        shell: bash
        run: |
          set -euo pipefail
          rm -rf sequence_output
          blender --background --factory-startup \
            --python-exit-code 1 \
            --python blender/build_sequence_demo.py

      - name: Upload prepared sequence
        uses: actions/upload-artifact@v4
        with:
          name: sequence-prepared
          path: |
            sequence_output/sequence-animated.blend
            sequence_output/sequence-preview.png
            sequence_output/sequence-manifest.json
          if-no-files-found: error

  render:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: "01"
            start: 1
            end: 30
          - shard: "02"
            start: 31
            end: 60
          - shard: "03"
            start: 61
            end: 90
          - shard: "04"
            start: 91
            end: 120
          - shard: "05"
            start: 121
            end: 150
          - shard: "06"
            start: 151
            end: 180

    steps:
      - uses: actions/checkout@v4

      - name: Cache Blender
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/blender-5.2.2
          key: blender-linux-x64-5.2.2

      - name: Install Blender
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$BLENDER_CACHE"
          if [ ! -x "$BLENDER_CACHE/blender" ]; then
            archive="blender-${BLENDER_VERSION}-linux-x64.tar.xz"
            base="https://download.blender.org/release/Blender5.2"
            curl --fail --location --retry 4 --output "/tmp/$archive" "$base/$archive"
            tar -xJf "/tmp/$archive" -C "$BLENDER_CACHE" --strip-components=1
          fi
          echo "$BLENDER_CACHE" >> "$GITHUB_PATH"

      - name: Install headless dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libx11-6 libxi6 libxfixes3 libxrender1 \
            libxxf86vm1 libxkbcommon0

      - name: Download prepared sequence
        uses: actions/download-artifact@v4
        with:
          name: sequence-prepared
          path: sequence_output

      - name: Render shard
        shell: bash
        env:
          START_FRAME: ${{ matrix.start }}
          END_FRAME: ${{ matrix.end }}
        run: |
          set -euo pipefail
          mkdir -p sequence_output/frames
          blender sequence_output/sequence-animated.blend --background \
            -s "$START_FRAME" \
            -e "$END_FRAME" \
            -o "$GITHUB_WORKSPACE/sequence_output/frames/frame_" \
            -F PNG \
            --render-anim
          expected=$((END_FRAME - START_FRAME + 1))
          actual=$(find sequence_output/frames -maxdepth 1 -name 'frame_*.png' | wc -l)
          test "$actual" -eq "$expected"

      - name: Upload shard
        uses: actions/upload-artifact@v4
        with:
          name: sequence-frames-${{ matrix.shard }}
          path: sequence_output/frames/
          if-no-files-found: error
          compression-level: 1

  finalize:
    needs:
      - prepare
      - render
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Cache Blender
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/blender-5.2.2
          key: blender-linux-x64-5.2.2

      - name: Install Blender
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$BLENDER_CACHE"
          if [ ! -x "$BLENDER_CACHE/blender" ]; then
            archive="blender-${BLENDER_VERSION}-linux-x64.tar.xz"
            base="https://download.blender.org/release/Blender5.2"
            curl --fail --location --retry 4 --output "/tmp/$archive" "$base/$archive"
            tar -xJf "/tmp/$archive" -C "$BLENDER_CACHE" --strip-components=1
          fi
          echo "$BLENDER_CACHE" >> "$GITHUB_PATH"

      - name: Install verification dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libx11-6 libxi6 libxfixes3 libxrender1 \
            libxxf86vm1 libxkbcommon0 ffmpeg

      - name: Download prepared sequence
        uses: actions/download-artifact@v4
        with:
          name: sequence-prepared
          path: sequence_output

      - name: Download all frames
        uses: actions/download-artifact@v4
        with:
          pattern: sequence-frames-*
          path: sequence_output/frames
          merge-multiple: true

      - name: Validate frames
        shell: bash
        run: |
          set -euo pipefail
          actual=$(find sequence_output/frames -maxdepth 1 -name 'frame_*.png' | wc -l)
          test "$actual" -eq 180
          test -s sequence_output/frames/frame_0001.png
          test -s sequence_output/frames/frame_0180.png

      - name: Encode MP4
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -y \
            -framerate 30 \
            -start_number 1 \
            -i sequence_output/frames/frame_%04d.png \
            -c:v libx264 \
            -pix_fmt yuv420p \
            -crf 20 \
            -movflags +faststart \
            sequence_output/sequence-demo.mp4
          ffprobe -v error \
            -show_entries stream=width,height,r_frame_rate \
            -show_entries format=duration,size \
            -of json sequence_output/sequence-demo.mp4

      - name: Verify frozen sequence contract
        shell: bash
        run: |
          set -euo pipefail
          blender sequence_output/sequence-animated.blend --background \
            --python-exit-code 1 \
            --python blender/verify_sequence_demo.py
          cat sequence_output/sequence-verification.json

      - name: Remove intermediate frames
        run: rm -rf sequence_output/frames

      - name: Upload sequence evidence
        uses: actions/upload-artifact@v4
        with:
          name: rubik-sequence-480
          path: sequence_output/
          if-no-files-found: error
